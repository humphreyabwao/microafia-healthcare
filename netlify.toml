# Microafia Healthcare - Netlify Configuration
# Clean URLs & SEO Optimization

[build]
  publish = "."

# Pretty URLs - removes .html extension
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Redirect .html URLs to clean URLs
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Specific page redirects
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/lab-services.html"
  to = "/lab-services"
  status = 301
  force = true

[[redirects]]
  from = "/imaging-services.html"
  to = "/imaging-services"
  status = 301
  force = true

[[redirects]]
  from = "/book-appointment.html"
  to = "/book-appointment"
  status = 301
  force = true

[[redirects]]
  from = "/book-wellness.html"
  to = "/book-wellness"
  status = 301
  force = true

# Admin pages
[[redirects]]
  from = "/admin/*.html"
  to = "/admin/:splat"
  status = 301
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
