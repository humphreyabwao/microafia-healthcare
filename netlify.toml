# Microafia Healthcare - Netlify Configuration
# Clean URLs & SEO Optimization

[build]
  publish = "."

# Admin pages - serve .html files for clean URLs
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/:page"
  to = "/admin/:page.html"
  status = 200

# Redirect admin .html URLs to clean URLs
[[redirects]]
  from = "/admin/index.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin/:page.html"
  to = "/admin/:page"
  status = 301
  force = true

# Pretty URLs for root pages - removes .html extension
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
