# Microafia Healthcare - Netlify
[build]
  publish = "."

# Ensure /admin loads with trailing slash so relative assets resolve correctly
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
  force = false

# Headers for static assets
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
