<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Microafia Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <!-- Fonts and icons load without blocking the first paint of the sign-in form -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </noscript>
    <link rel="preload" as="image" type="image/webp" href="/images/optimized/about-consultation-3e6b74b045-1024.webp" imagesrcset="/images/optimized/about-consultation-3e6b74b045-640.webp 640w, /images/optimized/about-consultation-3e6b74b045-1024.webp 1024w, /images/optimized/about-consultation-3e6b74b045-1254.webp 1254w" imagesizes="(max-width: 860px) 100vw, 55vw">
    <link rel="stylesheet" href="/admin/login.css">
    <meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body>
    <main class="login-page">
        <!-- Photo panel -->
        <section class="login-visual" aria-hidden="true">
            <picture>
                <source type="image/webp"
                        srcset="/images/optimized/about-consultation-3e6b74b045-640.webp 640w,
                                /images/optimized/about-consultation-3e6b74b045-1024.webp 1024w,
                                /images/optimized/about-consultation-3e6b74b045-1254.webp 1254w"
                        sizes="(max-width: 860px) 100vw, 55vw">
                <img src="/images/optimized/about-consultation-3e6b74b045-1024.webp" alt="" width="1254" height="1254" fetchpriority="high" decoding="async">
            </picture>
            <div class="login-visual-copy">
                <p class="login-visual-kicker">Microafia Healthcare</p>
                <p class="login-visual-quote">Every booking, test and delivery &mdash; looked after in one place.</p>
            </div>
        </section>

        <!-- Sign-in panel -->
        <section class="login-panel">
            <div class="login-card">
                <a href="/" class="login-logo" aria-label="Microafia Healthcare website">
                    <img src="/images/optimized/logo-f4248e8a92-320.webp" alt="Microafia Healthcare" width="320" height="114" decoding="async">
                </a>

                <header class="login-head">
                    <h1>Staff sign in</h1>
                    <p>Use your Microafia staff account to open the admin dashboard.</p>
                </header>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="name@microafiahealthcare.co.ke" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" autofocus required>
                    </div>

                    <div class="field">
                        <div class="field-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-password" id="forgotPassword">Forgot password?</a>
                        </div>
                        <div class="password-wrap">
                            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="error-message" id="errorMessage" role="alert" aria-live="polite"></div>

                    <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
                </form>

                <p class="login-footer">
                    <a href="/">&larr; Back to the website</a>
                    <span>Authorised staff only</span>
                </p>
            </div>
        </section>
    </main>

    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/13.4.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore-compat.js"></script>
    <script defer src="/firebase-config.js"></script>
    <script defer src="/url-helper.js"></script>
    <script defer src="/admin/login.js"></script>
</body>
</html>
