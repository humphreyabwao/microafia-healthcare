<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Microafia Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="../images/Logo.png" alt="Microafia" class="sidebar-logo">
        </div>
        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
                <li class="nav-item"><a href="appointments.html" class="nav-link"><i class="fas fa-calendar-check"></i><span>Appointments</span></a></li>
                <li class="nav-item"><a href="lab-orders.html" class="nav-link"><i class="fas fa-flask"></i><span>Lab Orders</span></a></li>
                <li class="nav-item"><a href="wellness.html" class="nav-link"><i class="fas fa-heart-pulse"></i><span>Wellness Bookings</span></a></li>
                <li class="nav-item"><a href="messages.html" class="nav-link"><i class="fas fa-envelope"></i><span>Messages</span></a></li>
                <li class="nav-item"><a href="callbacks.html" class="nav-link"><i class="fas fa-phone-alt"></i><span>Callback Requests</span></a></li>
            </ul>
            <div class="nav-divider"></div>
            <ul class="nav-list">
                <li class="nav-item"><a href="settings.html" class="nav-link"><i class="fas fa-cog"></i><span>Settings</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="back-to-site"><i class="fas fa-external-link-alt"></i><span>View Website</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper" id="mainWrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <h1 class="page-title">My Profile</h1>
            </div>
            <div class="topbar-right">
                <div class="topbar-item notification-dropdown">
                    <button class="topbar-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="badge" id="notifCount">0</span></button>
                </div>
                <div class="topbar-item profile-dropdown">
                    <button class="profile-btn" id="profileBtn">
                        <div class="profile-avatar"><i class="fas fa-user"></i></div>
                        <span class="profile-name">Admin</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="profileMenu">
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user-circle"></i><span>My Profile</span></a>
                        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i><span>Settings</span></a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="profile-container">
                <!-- Profile Header -->
                <div class="profile-header-card">
                    <div class="profile-avatar-section">
                        <div class="avatar-wrapper">
                            <img src="" alt="Profile" id="profileImage" class="avatar-img">
                            <div class="avatar-placeholder" id="avatarPlaceholder">
                                <i class="fas fa-user"></i>
                            </div>
                            <label class="avatar-upload" for="avatarInput">
                                <i class="fas fa-camera"></i>
                            </label>
                            <input type="file" id="avatarInput" accept="image/*" hidden>
                        </div>
                        <div class="profile-info">
                            <h2 id="displayName">Admin User</h2>
                            <p id="displayEmail">admin@microafia.com</p>
                            <span class="role-badge">Administrator</span>
                        </div>
                    </div>
                </div>

                <!-- Profile Form -->
                <div class="profile-card">
                    <div class="card-header">
                        <h3><i class="fas fa-user-edit"></i> Personal Information</h3>
                    </div>
                    <form id="profileForm" class="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" placeholder="Enter first name">
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" placeholder="Enter last name">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="Enter email" readonly>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" placeholder="Enter phone number">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="bio">Bio</label>
                            <textarea id="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary" id="saveProfileBtn">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="profile-card">
                    <div class="card-header">
                        <h3><i class="fas fa-lock"></i> Change Password</h3>
                    </div>
                    <form id="passwordForm" class="profile-form">
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" placeholder="Enter current password">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="newPassword">New Password</label>
                                <input type="password" id="newPassword" placeholder="Enter new password">
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password</label>
                                <input type="password" id="confirmPassword" placeholder="Confirm new password">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-key"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="admin.js"></script>
    <script src="profile.js"></script>
</body>
</html>
